name: Temporary npm lockfile remediation

on:
  push:
    branches:
      - ci/comprehensive-pipeline

permissions:
  contents: write

concurrency:
  group: npm-lock-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update vulnerable dependency resolutions
        run: |
          npm ci
          npm audit fix
          npm run build
          npm audit --audit-level=high

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix vulnerable npm dependency resolutions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
