name: Temporary Composer security remediation

on:
  push:
    branches:
      - ci/comprehensive-pipeline

permissions:
  contents: write

concurrency:
  group: composer-lock-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Update vulnerable Composer dependencies
        run: |
          composer update filament/filament laravel/framework league/commonmark symfony/http-foundation symfony/yaml --with-all-dependencies --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/ci.sqlite
          php artisan migrate --force
          composer audit --locked
          composer test

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Fix vulnerable Composer dependency resolutions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
